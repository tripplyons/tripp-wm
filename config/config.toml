# tripp-wm reloads this file when it changes. Command list: tripp-wmctl --help

# Space between columns, stacked windows, and screen edges, in points.
gaps = 8
# Column widths, as fractions of the screen, that cycle-width steps through.
column-widths = [0.333, 0.5, 0.667, 1.0]
default-column-width = 0.5

# Duration in milliseconds; 0 disables animation. Easing: linear,
# ease-out-cubic, or ease-in-out-cubic. Workspace switches stay instant.
[animations.focus]
duration = 180
easing = "ease-out-cubic"

[animations.move]
duration = 180
easing = "ease-out-cubic"

[border]
enabled = true
width = 2
color = "#f4cb7e"

# The pointer grid targets 24x24-point cells with three-letter labels.
# Type a label to click. Hold Shift on the third letter to right-click,
# or Cmd to middle-click. Backspace removes the last typed letter.
[grid]
background = "#000000b3"
text = "#ffedd7"
accent = "#f4cb7e"

# Replaces every default binding. Modifiers: alt, shift, ctrl, cmd.
[bindings]
"alt-h" = "focus left"
"alt-j" = "focus down"
"alt-k" = "focus up"
"alt-l" = "focus right"
"alt-shift-h" = "move left"
"alt-shift-j" = "move down"
"alt-shift-k" = "move up"
"alt-shift-l" = "move right"
"alt-[" = "consume-or-expel left"
"alt-]" = "consume-or-expel right"
"alt-r" = "cycle-width"
"alt-f" = "maximize-column"
"alt-c" = "center-column"
"alt-shift-f" = "toggle-float"
"alt-space" = "grid"
"alt-t" = "exec open -na Ghostty.app"
"alt-tab" = "workspace back-and-forth"
"alt-u" = "workspace next"
"alt-i" = "workspace prev"
"alt-1" = "workspace 1"
"alt-2" = "workspace 2"
"alt-3" = "workspace 3"
"alt-4" = "workspace 4"
"alt-5" = "workspace 5"
"alt-6" = "workspace 6"
"alt-7" = "workspace 7"
"alt-8" = "workspace 8"
"alt-9" = "workspace 9"
"alt-shift-1" = "move-to-workspace 1"
"alt-shift-2" = "move-to-workspace 2"
"alt-shift-3" = "move-to-workspace 3"
"alt-shift-4" = "move-to-workspace 4"
"alt-shift-5" = "move-to-workspace 5"
"alt-shift-6" = "move-to-workspace 6"
"alt-shift-7" = "move-to-workspace 7"
"alt-shift-8" = "move-to-workspace 8"
"alt-shift-9" = "move-to-workspace 9"
"alt-shift-r" = "reload-config"

# The first rule whose app-id matches a new window applies. Find an app's
# ID with: osascript -e 'id of app "App Name"'
[[rules]]
app-id = "com.apple.systempreferences"
float = true

[[rules]]
app-id = "com.apple.calculator"
float = true
